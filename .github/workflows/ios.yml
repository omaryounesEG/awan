name: iOS build

# Builds an unsigned .ipa on a macOS runner. The repository is public, so the
# macOS minutes are free. Unsigned output installs via sideloading tools only
# (AltStore / Sideloadly); a signed App Store or TestFlight build needs an
# Apple Developer account and signing secrets.
#
# Flutter runs `pod install` itself as part of `flutter build ios`, so there is
# no separate CocoaPods step to keep in sync. On failure the log is posted as an
# issue, because Actions logs need authentication to download.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ios.yml'

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Flutter SDK (pinned to the version the project targets)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Build (no code signing)
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee ci-ios.log

      - name: Package unsigned .ipa
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -qry "Awan-unsigned.ipa" Payload
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: awan-ios-unsigned
          path: build/ipa/Awan-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish failure log as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -c 60000 ci-ios.log > ci-tail.log 2>/dev/null || echo "no log captured" > ci-tail.log
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "CI: iOS build failed (${GITHUB_SHA:0:7})" \
            --body-file ci-tail.log || true
